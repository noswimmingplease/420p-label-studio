[package]
name = "dymo-420p"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "label-studio-420p"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
base64 = "0.22"
arboard = { version = "3.7", default-features = false }
rfd = "0.15"
tray-icon = "0.21"
wait-timeout = "0.2"
sha2 = { version = "=0.11.1", default-features = false }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[build-dependencies]
winresource = "0.1"
